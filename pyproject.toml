[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webcrawler"
version = "0.1.0"
description = "Concurrent web crawling with search seeds and JSON logs"
requires-python = ">=3.10"
dependencies = [
    # Crawling and search
    "beautifulsoup4>=4.12,<5",
    "ddgs>=9.16,<10",
    "lxml>=5,<7",
    "tldextract>=5,<6",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
webcrawler = "app.__main__:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["settings"]
include-package-data = false

[tool.setuptools.package-data]
app = ["banned_extensions.csv"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
